<div>
    <section>
        <h1>Character List</h1>

                <ng-container *ngIf="characters; else loading">
                    <article class="rm-card" *ngFor="let character of characters.results">
                        <div class="rm-card__media">
                            <img
                                class="rm-card__img"
                                [src]="character.image"
                                [alt]="character.name"
                                loading="lazy"
                            />
                            <span class="rm-chip rm-chip--alive">{{ character.status }}</span>
                        </div>

                        <div class="rm-card__body">
                            <h3 class="rm-card__title" [title]="character.name">{{ character.name }}</h3>

                            <div class="rm-card__meta">
                                <span class="rm-pill">{{ character.species }}</span>
                                <span class="rm-pill">{{ character.gender }}</span>
                                <span class="rm-pill">Eps: {{ character.episode.length }}</span>
                            </div>

                            <dl class="rm-card__dl">
                                <div class="rm-row">
                                    <dt>Origin</dt>
                                    <dd>{{ character.origin?.name }}</dd>
                                </div>
                                <div class="rm-row">
                                    <dt>Location</dt>
                                    <dd>{{ character.location?.name }}</dd>
                                </div>
                            </dl>

                            <div class="rm-card__actions">
                                <button class="rm-btn rm-btn--primary" type="button">Ver detalle</button>
                                <a class="rm-btn" [href]="character.url || '#'" aria-label="Abrir en API" target="_blank" rel="noopener">Abrir</a>
                            </div>
                        </div>
                    </article>
                </ng-container>

                <ng-template #loading>
                    <p>Loading characters...</p>
                </ng-template>
    </section>
</div>
